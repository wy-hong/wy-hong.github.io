<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精灵大作战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ====== 按键提示页 ====== -->
  <div class="splash-screen" id="splash-screen">
    <canvas class="splash-particles" id="splash-particles"></canvas>
    <div class="splash-inner">
      <h1 class="splash-title">精灵大作战</h1>
      <p class="splash-subtitle">训练师，准备好了吗？</p>
      <div class="splash-tips">
        <div class="tip-item">
          <span class="tip-text">怪物A被冰冻后使用普攻把怪A打到怪B身上，可使A死亡、B扣血</span>
        </div>
        <div class="tip-item">
          <span class="tip-text">由于不可修复的bug怪物不会从梯子往上爬，请尽量在下层平台战斗</span>
        </div>
        <div class="tip-item">
          <span class="tip-icon">🟡</span>
          <span class="tip-text">经验</span>
          <span class="tip-sep">｜</span>
          <span class="tip-icon tip-icon-sm">🔴</span>
          <span class="tip-text">血包</span>
          <span class="tip-sep">｜</span>
          <span class="tip-icon tip-icon-sm">🟣</span>
          <span class="tip-text">怪物攻击，请躲开</span>
        </div>
      </div>

      <!-- 操作键位 -->
      <div class="splash-controls">
        <div class="ctrl-group">
          <span class="ctrl-label">移动</span>
          <div class="keys-row">
            <span class="keycap key-top">W<span class="key-sub">跳跃</span></span>
          </div>
          <div class="keys-row">
            <span class="keycap">A<span class="key-sub">左移</span></span>
            <span class="keycap">S<span class="key-sub">下爬</span></span>
            <span class="keycap">D<span class="key-sub">右移</span></span>
          </div>
        </div>
        <div class="ctrl-group">
          <span class="ctrl-label">攻击</span>
          <div class="keys-row">
            <span class="keycap key-atk key-top">I<span class="key-sub">大招</span></span>
          </div>
          <div class="keys-row">
            <span class="keycap key-atk">J<span class="key-sub">普攻</span></span>
            <span class="keycap key-atk">K<span class="key-sub">冰冻</span></span>
            <span class="keycap key-atk">L<span class="key-sub">远攻</span></span>
          </div>
        </div>
      </div>

      <button class="splash-start-btn" id="btn-splash-start">开 始 游 戏</button>
      <p class="splash-enter-hint">或按 Enter 键</p>
    </div>
  </div>

  <!-- ====== 游戏区 ====== -->
  <h1>精灵大作战</h1>
  <canvas id="game"></canvas>
  <button id="pause-btn" title="暂停 / 继续 (P)">&#10074;&#10074;</button>
  <button id="restart-btn">重新开始</button>
  <div class="help">
    移动：A D &nbsp; 跳跃：空格/W &nbsp; 爬梯：W 上 / S 下 &nbsp; 暂停：P &nbsp;｜&nbsp; 攻击：J 普攻 · K 冰冻 · L 远攻 · I 大招
  </div>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/player.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>
  <!-- 启动逻辑：完全内联，不依赖外部脚本的 onclick 绑定 -->
  <script>
  (function () {
    var btn = document.getElementById('btn-splash-start');
    var gameStarted = false;

    function tryLaunch() {
      if (gameStarted) return;
      if (typeof window.launchGame === 'function') {
        window.launchGame();
        gameStarted = true;
      } else {
        document.body.innerHTML = '<div style="color:#ff6b6b;text-align:center;padding-top:30vh;font:20px monospace;background:#0d1117;height:100vh;">'
          + '<p>❌ 脚本加载失败</p>'
          + '<p style="font-size:14px;color:#888;margin-top:16px;">请按 <b>F12</b> → <b>Console</b> 查看红色报错信息</p>'
          + '<p style="font-size:14px;color:#888;">然后截图发给开发者</p>'
          + '<button onclick="location.reload()" style="margin-top:24px;padding:10px 24px;cursor:pointer;">🔄 刷新重试</button>'
          + '</div>';
      }
    }

    btn.addEventListener('click', tryLaunch);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !gameStarted) {
        e.preventDefault();
        tryLaunch();
      }
    });
  })();
  </script>
</body>
</html>
